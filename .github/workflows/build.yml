  name: Build mod

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build --no-daemon -Pmod_version="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build --no-daemon
          fi

      # Actions 실행 결과 화면에서 받을 수 있는 jar (테스트용)
      - uses: actions/upload-artifact@v4
        with:
          name: guild-war-tracker
          path: mod/build/libs/*.jar

      # v로 시작하는 태그(예: v1.0.0)로 Release를 만들면 jar가 자동으로 첨부됨
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mod/build/libs/*.jar
